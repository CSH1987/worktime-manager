# 매일 03:00(KST) 운영 데이터 전체를 받아 이 레포의 backups 브랜치에 커밋한다(별도 레포 없음).
# ⚠️ 이 레포가 비공개일 때만 켠다 — 공개 레포면 백업이 누구에게나 보이므로 아래 확인 단계에서 멈춘다.
# 필요한 비밀값: Settings → Secrets and variables → Actions → WORKTIME_EXPORT_TOKEN (Netlify 에 넣은 것과 같은 값)
# 실패하면 GitHub 가 레포 주인에게 메일을 보낸다. 복구: scripts/restore.mjs
name: daily-backup
on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = KST 03:00
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: daily-backup
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 비공개 레포인지 확인
        if: github.event.repository.private != true
        run: |
          echo "공개 레포라 백업을 올리지 않습니다(데이터가 공개됨). 레포를 비공개로 바꾼 뒤 다시 실행하세요."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: backups 브랜치로 (없으면 빈 브랜치 생성)
        run: |
          if git ls-remote --exit-code --heads origin backups >/dev/null; then
            git switch backups
          else
            git switch --orphan backups
            git rm -rf --quiet . || true
          fi
      - name: 내보내기 받기
        env:
          TOKEN: ${{ secrets.WORKTIME_EXPORT_TOKEN }}
          SITE: https://team-worktime.netlify.app
        run: |
          set -euo pipefail
          day=$(TZ=Asia/Seoul date +%Y/%m/%d)
          mkdir -p "backups/$(dirname "$day")"
          curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer $TOKEN" "$SITE/api/export" -o /tmp/export.json
          # 모양 확인 — 팀원 목록이 비어 있으면 실패로 본다(빈 데이터로 덮어쓰지 않게)
          node -e 'const b=require("/tmp/export.json"); if(b.format!=="worktime-backup/1"||!b.data||!b.data.members.length){console.error("백업 모양 이상"); process.exit(1)} console.log(Object.fromEntries(Object.entries(b.data).map(([k,v])=>[k,v.length])))'
          cp /tmp/export.json "backups/$day.json"
          cp /tmp/export.json latest.json
      - name: 커밋
        run: |
          git config user.name "worktime-backup"
          git config user.email "worktime-backup@users.noreply.github.com"
          git add backups latest.json
          git diff --cached --quiet && echo "바뀐 것 없음" || git commit -m "backup $(TZ=Asia/Seoul date +%F)"
          git push origin backups
