# Netlify 배포 설정 — Next.js 는 Netlify 가 자동 인식(OpenNext 어댑터)합니다.
# 데이터는 Netlify Blobs(store "worktime")에 저장되며 따로 설정할 키가 없습니다.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# `netlify dev` 의 로컬 Blobs 흉내 서버는 읽을 때 버전(ETag)을 주지 않아
# 조건부 쓰기가 동작하지 않는다 → 로컬 실행은 파일 저장소를 쓴다.
[context.dev.environment]
  WORKTIME_STORE = "file"
